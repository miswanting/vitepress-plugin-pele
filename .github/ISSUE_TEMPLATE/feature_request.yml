name: Feature request
description: Suggest a new option, integration, or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case rather than only the proposed API.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like the plugin to behave? Include config or Markdown examples if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other plugins, or Mermaid/Pele features you have tried.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand this is a build-time, static-SVG plugin and features that require mermaid.js at runtime may be out of scope.
          required: false
        - label: I am willing to open a pull request for this.
          required: false
