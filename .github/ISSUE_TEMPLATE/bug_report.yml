name: Bug report
description: Something renders incorrectly, crashes, or is missing from the build output.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction when possible — a Markdown snippet and the relevant config are usually enough.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and how it differs from what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Markdown, config and any custom CSS needed to reproduce the issue.
      render: markdown
      placeholder: |
        ```mermaid
        flowchart LR
          A --> B
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: vitepress-plugin-pele version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: vitepress-version
    attributes:
      label: VitePress version
      placeholder: 2.0.0-alpha.20
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.20.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Build output / stack trace
      description: Paste the relevant warning or error, including the file name and line number.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the README.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true
